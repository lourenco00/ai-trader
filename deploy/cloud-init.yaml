#cloud-config
# Paste this into the "Cloud config" box when creating the server. It creates a key-only user, installs
# Docker, turns on the firewall (SSH only) and automatic security updates. The key below is a PUBLIC key.
users:
  - name: trader
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa  lourencoramossantos@gmail.com
package_update: true
packages:
  - ufw
  - unattended-upgrades
  - ca-certificates
  - curl
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker trader
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw --force enable
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - systemctl restart ssh
  - touch /var/lib/cloud/ai-trader-ready
